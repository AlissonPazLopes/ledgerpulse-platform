[project]
name = "risk-engine-ai"
version = "1.0.0"
description = "LedgerPulse Hybrid Fraud Risk Engine (FastAPI + Scikit-Learn)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
