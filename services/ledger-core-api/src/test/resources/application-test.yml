spring:
  datasource:
    url: jdbc:h2:mem:ledgerpulse_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ledger_core
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    schemas: ledger_core
    default-schema: ledger_core
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger_core

management:
  health:
    redis:
      enabled: false
