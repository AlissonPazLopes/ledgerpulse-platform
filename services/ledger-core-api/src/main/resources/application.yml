server:
  port: ${CORE_API_PORT:8080}

spring:
  application:
    name: ledger-core-api
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerpulse}
    username: ${POSTGRES_USER:ledgerpulse}
    password: ${POSTGRES_PASSWORD:ledgerpulse_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: ledger_core
    default-schema: ledger_core
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger_core
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:${RABBITMQ_AMQP_PORT:5672}}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:ledgerpulse}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:ledgerpulse_dev}}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ledger-core-api

app:
  version: "0.1.0"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      secret: ${LEDGERPULSE_JWT_SECRET:ledgerpulse-dev-jwt-secret-key-at-least-32-bytes-long-2026}
      expiration-seconds: 3600
  idempotency:
    store: ${LEDGERPULSE_IDEMPOTENCY_STORE:redis}
    ttl-hours: 24
  outbox:
    exchange: ledger.events
    relay:
      enabled: true
      fixed-delay-ms: 2000
      max-attempts: 5
  risk-engine:
    mode: ${LEDGERPULSE_RISK_ENGINE_MODE:http}
    base-url: ${RISK_ENGINE_URL:http://localhost:8001}
    connect-timeout-ms: 1000
    read-timeout-ms: 1500
  sse:
    heartbeat-enabled: ${LEDGERPULSE_SSE_HEARTBEAT_ENABLED:true}
    heartbeat-interval-ms: 15000
    emitter-timeout-ms: 0
  reconciliation:
    scheduled:
      enabled: ${LEDGERPULSE_RECONCILIATION_SCHEDULED_ENABLED:true}
      fixed-delay-ms: 300000
      initial-delay-ms: 60000
  rate-limit:
    enabled: ${LEDGERPULSE_RATE_LIMIT_ENABLED:true}
    store: ${LEDGERPULSE_RATE_LIMIT_STORE:redis}
    capacity: ${LEDGERPULSE_RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${LEDGERPULSE_RATE_LIMIT_REFILL_TOKENS:60}
    refill-period-seconds: ${LEDGERPULSE_RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      riskEngine:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    retryAspectOrder: 2
    instances:
      riskEngine:
        maxAttempts: 2
        waitDuration: 100ms

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
