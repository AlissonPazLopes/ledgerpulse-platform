openapi: 3.1.0
info:
  title: LedgerPulse Core API
  version: "1.0.0"
  description: >
    Contrato REST v1 oficial do microsserviço `ledger-core-api` (Java 21 + Spring Boot 3.3+).
    Congelado para Semanas 1, 2, 3 e 5 no fluxo Contract-First.
    Invariante monetário: todos os valores financeiros são representados em centavos inteiros (`int64`).
servers:
  - url: http://localhost:8080
    description: Ambiente Local (Docker Compose / Spring Boot)
tags:
  - name: Health
    description: Diagnóstico operacional do serviço
  - name: Auth
    description: Autenticação de operadores internos via JWT
  - name: Admin
    description: Operações administrativas exclusivas para role ADMIN
  - name: Merchants
    description: Identidade e configurações do merchant autenticado via X-API-Key
  - name: Accounts
    description: Gestão de contas financeiras com Optimistic Locking (`version`)
  - name: Ledger
    description: Consulta auditável ao livro-razão append-only de partidas dobradas
  - name: Payments
    description: Criação, split de marketplace e consulta de pagamentos idempotentes
  - name: Risk Review
    description: Fila de revisão manual antifraude e decisão de analistas
  - name: Dashboard
    description: KPIs executivos e série horária para o console administrativo
  - name: Refunds
    description: Estornos totais e parciais com lançamentos compensatórios append-only
  - name: Reconciliation
    description: Auditoria periódica/manual de integridade contábil e exportação CSV
  - name: SSE Stream
    description: Stream Server-Sent Events em tempo real para o Dashboard Executivo
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Healthcheck operacional da API
      operationId: getHealth
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autentica operador interno e emite JWT
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciais inválidas (`invalid-credentials`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: https://ledgerpulse.dev/errors/invalid-credentials
                title: Invalid Credentials
                status: 401
                detail: Credenciais inválidas para o email informado.
                instance: /api/v1/auth/login
                correlationId: 4f3c9f62-8b9a-4f3b-9d1a-0192837465ab
                timestamp: "2026-11-20T22:30:00Z"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Retorna perfil e role do operador autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Perfil do operador autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/status:
    get:
      tags:
        - Admin
      summary: Endpoint administrativo exclusivo para role ADMIN
      operationId: getAdminStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Acesso autorizado para role ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/merchants/me:
    get:
      tags:
        - Merchants
      summary: Retorna dados do merchant autenticado por X-API-Key
      operationId: getCurrentMerchant
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Merchant autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/accounts:
    post:
      tags:
        - Accounts
      summary: Cria conta financeira no Ledger
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Conta criada com saldos zerados e version=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags:
        - Accounts
      summary: Lista contas financeiras paginadas
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: accountType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountType"
        - name: merchantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista paginada de contas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Consulta detalhes e versão de concorrência de uma conta
      operationId: getAccountById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalhes da conta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ledger/transactions:
    get:
      tags:
        - Ledger
      summary: Lista transações contábeis paginadas
      operationId: listLedgerTransactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: referenceType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LedgerReferenceType"
        - name: referenceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista paginada de transações do Ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerTransactionPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/ledger/transactions/{id}:
    get:
      tags:
        - Ledger
      summary: Detalha uma transação contábil e todas as partidas dobradas (`DEBIT`/`CREDIT`)
      operationId: getLedgerTransactionById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transação contábil balanceada com suas entradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerTransactionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/payments:
    post:
      tags:
        - Payments
      summary: Cria cobrança idempotente, executa Split, Double-Entry Ledger e Outbox
      operationId: createPayment
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Pagamento criado/processado (ou replay idêntico cacheado)
          headers:
            X-Idempotent-Replay:
              description: Presente com valor `true` quando retornado via cache de idempotência
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags:
        - Payments
      summary: Lista pagamentos paginados
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: merchantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista paginada de pagamentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/payments/{id}:
    get:
      tags:
        - Payments
      summary: Consulta detalhes de um pagamento por ID
      operationId: getPaymentById
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalhes do pagamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/payments/{id}/refunds:
    post:
      tags:
        - Refunds
      summary: Executa estorno total ou parcial idempotente com lançamento compensatório PAYMENT_REFUND
      operationId: createPaymentRefund
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Estorno criado e liquidado no Ledger (ou replay idêntico cacheado)
          headers:
            X-Idempotent-Replay:
              description: Presente com valor `true` quando retornado via cache de idempotência
              schema:
                type: string
            X-RateLimit-Limit:
              description: Capacidade do Token Bucket para X-API-Key
              schema:
                type: integer
                format: int32
            X-RateLimit-Remaining:
              description: Tokens restantes para X-API-Key
              schema:
                type: integer
                format: int32
            X-RateLimit-Reset:
              description: Epoch em segundos para recarga completa do Token Bucket
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags:
        - Refunds
      summary: Lista estornos de um pagamento ordenados por createdAt DESC
      operationId: listPaymentRefunds
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de estornos do pagamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/risk/reviews:
    get:
      tags:
        - Risk Review
      summary: Lista fila paginada de pagamentos em revisão manual antifraude (ANALYST/ADMIN)
      operationId: listRiskReviews
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: merchantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: minRiskScore
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Fila paginada de pagamentos aguardando revisão manual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskReviewPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/risk/reviews/{paymentId}/decision:
    post:
      tags:
        - Risk Review
      summary: Registra decisão de analista (APPROVE ou DECLINE) sobre pagamento em MANUAL_REVIEW
      operationId: submitRiskReviewDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskReviewDecisionRequest"
      responses:
        "200":
          description: Decisão registrada e pagamento liquidado ou recusado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskReviewDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/dashboard/summary:
    get:
      tags:
        - Dashboard
      summary: Retorna KPIs executivos e série horária agregada
      operationId: getDashboardSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Resumo executivo calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reconciliation/run:
    post:
      tags:
        - Reconciliation
      summary: Executa conciliação contábil manual sob demanda (ADMIN)
      operationId: runReconciliation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "201":
          description: Relatório de conciliação gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/reconciliation/reports:
    get:
      tags:
        - Reconciliation
      summary: Lista relatórios de conciliação contábil paginados
      operationId: listReconciliationReports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Lista paginada de relatórios de conciliação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReportPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reconciliation/export.csv:
    get:
      tags:
        - Reconciliation
      summary: Exporta relatórios de conciliação em formato CSV UTF-8
      operationId: exportReconciliationCsv
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Arquivo CSV de auditoria de conciliação
          headers:
            Content-Disposition:
              description: Anexo CSV padrão
              schema:
                type: string
                example: "attachment; filename=\"ledgerpulse-reconciliation.csv\""
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/stream/events:
    get:
      tags:
        - SSE Stream
      summary: Stream Server-Sent Events em tempo real (consumido via fetch + ReadableStream com JWT)
      operationId: streamEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Stream contínuo text/event-stream com eventos connected, heartbeat e eventos de domínio
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Índice da página (base 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Tamanho da página (máximo 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlação distribuída (gerado se omitido)
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única obrigatória para garantia de idempotência
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Erro de validação ou regra de entrada (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Não autenticado ou credencial/API Key inválida (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Acesso negado por RBAC ou escopo de merchant (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Recurso não encontrado (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Conflito de idempotência ou concorrência otimista `@Version` (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Limite de requisições excedido no Token Bucket Redis (RFC 7807)
      headers:
        X-RateLimit-Limit:
          description: Capacidade máxima do Token Bucket para a X-API-Key
          schema:
            type: integer
            format: int32
        X-RateLimit-Remaining:
          description: Tokens restantes (0 quando bloqueado)
          schema:
            type: integer
            format: int32
        X-RateLimit-Reset:
          description: Timestamp Unix epoch em segundos para recarga completa
          schema:
            type: integer
            format: int64
        Retry-After:
          description: Segundos inteiros recomendados antes de tentar novamente
          schema:
            type: integer
            format: int64
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Erro interno inesperado no servidor (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: ledger-core-api
        version:
          type: string
          example: "0.1.0"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-20T22:30:00Z"
    UserRole:
      type: string
      enum:
        - ADMIN
        - ANALYST
        - VIEWER
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@ledgerpulse.dev
        password:
          type: string
          minLength: 6
          example: LedgerPulse@2026
    UserProfile:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
