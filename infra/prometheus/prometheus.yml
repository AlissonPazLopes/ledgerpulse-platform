global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ledger-core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ledger-core-api:8080

  - job_name: risk-engine-ai
    metrics_path: /metrics
    static_configs:
      - targets:
          - risk-engine-ai:8001

  - job_name: webhook-dispatcher
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - webhook-dispatcher:8082
