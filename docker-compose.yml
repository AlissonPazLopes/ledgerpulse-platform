services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpulse}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpulse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ledgerpulse} -d $${POSTGRES_DB:-ledgerpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ledgerpulse-net

  redis:
    image: redis:7-alpine
    container_name: ledgerpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerpulse-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ledgerpulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ledgerpulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ledgerpulse_dev}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ledgerpulse-net

  risk-engine-ai:
    build:
      context: ./services/risk-engine-ai
      dockerfile: Dockerfile
    container_name: ledgerpulse-risk-engine
    restart: unless-stopped
    environment:
      RISK_ENGINE_PORT: "8001"
    ports:
      - "${RISK_ENGINE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ledgerpulse-net

  webhook-dispatcher:
    build:
      context: ./services/webhook-dispatcher
      dockerfile: Dockerfile
    container_name: ledgerpulse-webhook-dispatcher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      WEBHOOK_DISPATCHER_PORT: "8082"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpulse}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpulse_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-ledgerpulse}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-ledgerpulse_dev}
      LEDGERPULSE_JWT_SECRET: ${LEDGERPULSE_JWT_SECRET:-ledgerpulse-dev-jwt-secret-key-at-least-32-bytes-long-2026}
      WEBHOOK_DEFAULT_SINK_URL: http://webhook-dispatcher:8082/api/v1/sink/test
    ports:
      - "${WEBHOOK_DISPATCHER_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - ledgerpulse-net

networks:
  ledgerpulse-net:
    name: ledgerpulse-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
