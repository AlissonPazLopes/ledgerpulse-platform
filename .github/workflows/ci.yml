name: LedgerPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Self-test E2E script
        run: python3 infra/scripts/e2e_payment_dlq_flow.py --self-test

      - name: Self-test Chaos & Load script
        run: python3 infra/scripts/chaos_load_test.py --self-test

      - name: Validate Grafana dashboard and Postman collection JSON
        run: |
          python3 -c "import json; json.load(open('infra/grafana/dashboards/ledgerpulse-overview.json', encoding='utf-8'))"
          python3 -c "import json; json.load(open('docs/contracts/ledgerpulse.postman_collection.json', encoding='utf-8'))"

  ledger-core-api:
    name: Build & Test ledger-core-api (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-core-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: services/ledger-core-api/pom.xml

      - name: Run Maven tests
        run: mvn -B verify

  web-console:
    name: Typecheck, Test & Build web-console (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  risk-engine-ai:
    name: Lint & Test risk-engine-ai (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-engine-ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/risk-engine-ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Pytest suite
        run: pytest -v

  webhook-dispatcher:
    name: Build & Test webhook-dispatcher (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webhook-dispatcher
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: services/webhook-dispatcher/pom.xml

      - name: Run Maven tests
        run: mvn -B test
